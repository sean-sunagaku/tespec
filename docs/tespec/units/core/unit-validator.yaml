unit: unit-validator
title: Unit バリデーター
methods:
  - method: validateUnits
    cases:
      - action: 有効な units でバリデーションする
        expect:
          - hasErrors が false
          - issues が空
        type: normal
      - action: 重複する unit ID を検出する
        expect:
          - hasErrors が true
          - 重複エラーが報告される
        type: error
      - action: methods が空の unit を検出する
        expect: warning で methods が空と報告される
        type: boundary
      - action: cases が空の method を検出する
        expect: warning で cases が空と報告される
        type: boundary
      - action: type error のケースが 0 件の method を検出する
        expect: warning で異常系が 0 件と報告される
        type: boundary
      - action: type boundary のケースが 0 件の method を検出する
        expect: warning で境界値が 0 件と報告される
        type: boundary
      - action: units が空配列の場合
        expect:
          - hasErrors が false
          - issues が空
        type: boundary
