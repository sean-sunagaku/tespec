unit: user-service
title: "ユーザーサービス"
methods:
  - method: createUser
    cases:
      - action: "有効なメールで作成"
        expect: "User が返る"
      - action: "重複メールで作成"
        expect: "DuplicateEmailError"
        type: error
      - action: "空文字メールで作成"
        expect: "ValidationError"
        type: boundary
  - method: deleteUser
    cases:
      - action: "存在するユーザーを削除"
        expect: "正常に削除される"
      - action: "存在しないユーザーを削除"
        expect: "NotFoundError"
        type: error
      - action: "最小権限で削除"
        expect: "権限エラー"
        type: boundary
