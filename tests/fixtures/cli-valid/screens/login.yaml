screen: login
route: /login
title: ログイン画面
cases:
  - action: 画面を開く
    steps:
      - /login にアクセスする
    expect: フォームが表示される
  - action: 誤った認証情報で送信する
    steps:
      - /login にアクセスする
      - 誤った認証情報を入力する
      - 送信ボタンをクリックする
    expect: エラーが表示される
    type: error
  - action: 256文字のメールアドレスを入力する
    steps:
      - /login にアクセスする
      - 256文字のメールアドレスを入力する
    expect: バリデーションが表示される
    type: boundary
